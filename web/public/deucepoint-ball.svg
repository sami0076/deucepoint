<svg xmlns="http://www.w3.org/2000/svg" viewBox="27 45 46 46" width="256" height="256" class="mark isBare isIgnite" role="img" aria-label="Deucepoint">
  <style>
.mark { --dp-ink: currentColor; display: inline-block; vertical-align: middle; }
.ink { fill: var(--dp-ink); }
.ballFill { fill: var(--dp-ball, var(--dp-ink)); }
.flameOuter { fill: var(--dp-flame, var(--dp-ink)); stroke: var(--dp-flame, var(--dp-ink)); stroke-linejoin: round; paint-order: stroke; }
.flameInner { fill: var(--dp-flame-inner, var(--dp-paper, #F6F6F2)); }
.seam { fill: none; stroke: var(--dp-paper, #F6F6F2); stroke-linejoin: round; }
.ember { fill: var(--dp-flame, var(--dp-ink)); opacity: 0; }
.isFlame { --dp-flame: #FF5A1F; --dp-flame-inner: #FFC53D; }
.isOptic { --dp-ball: #DFFF4F; }
.isBare { overflow: visible; }

/* --- motion --------------------------------------------------------- */
.fire, .flames, .flameOuter, .flameInner { transform-box: fill-box; transform-origin: 50% 100%; }
.ball, .ember { transform-box: fill-box; transform-origin: 50% 50%; }
.drop { transform-box: fill-box; transform-origin: 50% 100%; }

.flames     { animation: sway 3.7s ease-in-out infinite; }
.flameOuter { animation: flickerA 1.9s ease-in-out infinite; }
.flameInner { animation: flickerB 1.3s ease-in-out infinite; }
.ember      { animation: ember var(--dur, 2.5s) ease-out var(--delay, 0s) infinite; }

/* hover: ball spins, fire stretches */
.fire { transition: transform 260ms ease; }
.mark:hover .fire, .isHot .fire { transform: scaleY(1.09) scaleX(1.03); }
.mark:hover .ball, .isSpinning .ball { animation: spin 0.9s linear infinite; }

/* ignite: ball pops in, fire grows from behind it */
.isIgnite .ball { animation: pop 0.55s cubic-bezier(.2,.9,.3,1.3) backwards; }
.isIgnite .fire { animation: ignite 0.8s 0.22s cubic-bezier(.2,.8,.2,1) backwards; }
.isIgnite .ember { animation-delay: calc(var(--delay, 0s) + 0.9s); }
/* bare ball (no flames): it drops in and bounces instead */
.isBare.isIgnite .ball { animation: none; }
.isBare.isIgnite .drop { animation: bounce 1.15s linear backwards; }
.mark:hover .ball, .isSpinning .ball { animation: spin 0.9s linear infinite; }

@keyframes flickerA {
  0%   { transform: scale(1, 1) skewX(0deg); }
  22%  { transform: scale(1.025, 0.975) skewX(-1.6deg); }
  41%  { transform: scale(0.985, 1.04) skewX(1.2deg); }
  63%  { transform: scale(1.015, 0.99) skewX(-0.6deg); }
  82%  { transform: scale(0.99, 1.025) skewX(1.8deg); }
  100% { transform: scale(1, 1) skewX(0deg); }
}
@keyframes flickerB {
  0%   { transform: scale(1, 1) skewX(0deg) translateX(0); }
  30%  { transform: scale(0.96, 1.07) skewX(2.2deg) translateX(0.4px); }
  55%  { transform: scale(1.04, 0.95) skewX(-1.6deg) translateX(-0.5px); }
  78%  { transform: scale(0.98, 1.03) skewX(0.8deg) translateX(0.2px); }
  100% { transform: scale(1, 1) skewX(0deg) translateX(0); }
}
@keyframes sway { 0%, 100% { transform: rotate(-1.1deg); } 50% { transform: rotate(1.1deg); } }
@keyframes ember {
  0%   { opacity: 0; transform: translate(0, 0) scale(1); }
  12%  { opacity: 0.95; }
  100% { opacity: 0; transform: translate(var(--dx, 0px), -18px) scale(0.25); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
@keyframes bounce {
  0%   { transform: translateY(-110px) scale(0.96, 1.06); animation-timing-function: cubic-bezier(.45,0,1,1); }
  34%  { transform: translateY(0) scale(1.14, 0.8); animation-timing-function: cubic-bezier(0,0,.55,1); }
  41%  { transform: translateY(-6px) scale(0.98, 1.04); animation-timing-function: cubic-bezier(0,0,.55,1); }
  53%  { transform: translateY(-38px) scale(1, 1); animation-timing-function: cubic-bezier(.45,0,1,1); }
  65%  { transform: translateY(0) scale(1.07, 0.9); animation-timing-function: cubic-bezier(0,0,.55,1); }
  76%  { transform: translateY(-13px) scale(1, 1); animation-timing-function: cubic-bezier(.45,0,1,1); }
  85%  { transform: translateY(0) scale(1.03, 0.96); animation-timing-function: cubic-bezier(0,0,.55,1); }
  92%  { transform: translateY(-4px); animation-timing-function: cubic-bezier(.45,0,1,1); }
  100% { transform: none; }
}
@keyframes ignite {
  0%   { transform: scaleY(0) scaleX(0.6); }
  55%  { transform: scaleY(1.12) scaleX(1.02); }
  80%  { transform: scaleY(0.96); }
  100% { transform: none; }
}

.mark[data-spin="never"]:hover .ball { animation: none; }

.isStatic *, .isStatic { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .mark *, .mark { animation: none !important; transition: none !important; }
  .ember { opacity: 0 !important; }
}
svg:root.mark { color: #14161A; }
  </style>
  <defs>
    <clipPath id="dpb-knockout">
      <path clip-rule="evenodd" d="M-200 -200H300V300H-200Z M24.5 68 a25.5 25.5 0 1 0 51 0 a25.5 25.5 0 1 0 -51 0Z"/>
    </clipPath>
    <clipPath id="dpb-ball"><circle cx="50" cy="68" r="22"/></clipPath>
  </defs>

  <g class="drop">
  <g class="ball">
    <circle class="ballFill" cx="50" cy="68" r="22"/>
    <g clip-path="url(#dpb-ball)">
      <path class="seam" style="stroke-width:5" d="M72.0 68.6L72.0 68.3L71.9 67.9L71.9 67.6L71.8 67.2L71.6 66.7L71.5 66.3L71.3 65.8L71.1 65.2L70.9 64.7L70.6 64.1L70.4 63.5L70.1 62.9L69.7 62.3L69.4 61.6L69.0 61.0L68.6 60.3L68.2 59.6L67.8 58.9L67.3 58.2L66.9 57.5L66.4 56.8L65.9 56.1L65.4 55.4L64.8 54.7L64.3 54.0L63.7 53.4L63.1 52.7L62.5 52.1L61.9 51.5L61.3 50.9L60.6 50.4L60.0 49.8L59.3 49.3L58.6 48.9L57.9 48.4L57.2 48.0L56.5 47.7L55.8 47.3L55.0 47.0L54.3 46.8L53.5 46.6L52.7 46.4L52.0 46.2L51.2 46.1L50.4 46.1L49.6 46.0L48.8 46.0L48.0 46.1 M32.0 55.4L31.6 55.9L31.3 56.5L31.0 57.0L30.8 57.6L30.5 58.1L30.4 58.7L30.3 59.2L30.2 59.7L30.1 60.2L30.2 60.7L30.2 61.2L30.3 61.7L30.4 62.2L30.6 62.7L30.8 63.2L31.1 63.6L31.4 64.1L31.8 64.5L32.2 65.0L32.6 65.4L33.1 65.9L33.6 66.3L34.1 66.7L34.6 67.2L35.2 67.6L35.9 68.0L36.5 68.4L37.2 68.8L37.9 69.3L38.6 69.7L39.3 70.1L40.0 70.6L40.8 71.0L41.5 71.5L42.3 71.9L43.0 72.4L43.8 72.8L44.5 73.3L45.3 73.8L46.0 74.3L46.7 74.8L47.4 75.3L48.1 75.8L48.8 76.3L49.4 76.8L50.0 77.3L50.6 77.9L51.2 78.4L51.7 79.0L52.2 79.5L52.6 80.1L53.0 80.6L53.4 81.2L53.7 81.7L54.0 82.3L54.2 82.8L54.4 83.3L54.6 83.8L54.7 84.4L54.7 84.9L54.7 85.4L54.7 85.8L54.6 86.3L54.5 86.7L54.4 87.1L54.2 87.5L53.9 87.9L53.6 88.3L53.3 88.6L52.9 88.9L52.5 89.1L52.1 89.3L51.7 89.5L51.2 89.7L50.7 89.8L50.1 89.9L49.6 90.0L49.0 90.0"/>
    </g>
  </g>
  </g>
</svg>
