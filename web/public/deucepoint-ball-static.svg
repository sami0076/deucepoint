.flameInner { fill: var(--dp-flame-inner, var(--dp-paper, #F6F6F2)); }
.seam { fill: none; stroke: var(--dp-paper, #F6F6F2); stroke-linejoin: round; }
.ember { fill: var(--dp-flame, var(--dp-ink)); opacity: 0; }
.isFlame { --dp-flame: #FF5A1F; --dp-flame-inner: #FFC53D; }
.isOptic { --dp-ball: #DFFF4F; }
.isBare { overflow: visible; }
svg:root.mark { color: #14161A; }
