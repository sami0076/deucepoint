<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deucepoint</title>
    <meta
      name="description"
      content="Match history, Elo ratings and head-to-heads across 1.6 million tennis matches."
    />
    <!-- Link previews: crawlers read this file without running the app, so the URLs are absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Deucepoint" />
    <meta property="og:title" content="Deucepoint" />
    <meta
      property="og:description"
      content="Match history, Elo ratings and head-to-heads across 1.6 million tennis matches."
    />
    <meta property="og:url" content="https://deucepoint.net/" />
    <meta property="og:image" content="https://deucepoint.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The deucepoint wordmark, with a tennis ball for the o." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)" />
    <!--
      Declared, so the browser stops probing /favicon.ico and 404ing on every
      page load. The SVG carries its own dark-mode rule; the PNG is for
      browsers that do not take an SVG icon.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Before the stylesheet and before React: a reader who chose dark must not
      see one cream frame first. Inline and tiny on purpose -- a module would
      arrive after the first paint, which is the frame this exists to fix.
      Storage throws in a private window, so the whole thing is guarded and a
      failure leaves the media query in tokens.css to answer.
    -->
    <script>
      try {
        var choice = localStorage.getItem('deucepoint:theme')
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.setAttribute('data-theme', choice)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
